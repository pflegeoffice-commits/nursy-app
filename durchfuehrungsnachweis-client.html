<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nursy – Durchführungsnachweis</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body[data-page="dn-client"] .dn-wrap{ padding:24px 0 40px; }
    body[data-page="dn-client"] .dn-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:16px; }
    body[data-page="dn-client"] .dn-actions{ display:flex; gap:10px; flex-wrap:wrap; }
    body[data-page="dn-client"] .stats-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:16px; }
    body[data-page="dn-client"] .stat-card strong{ display:block; font-size:26px; margin-top:6px; }
    body[data-page="dn-client"] .dn-filter{ margin:6px 0 14px; display:flex; gap:10px; flex-wrap:wrap; }
    body[data-page="dn-client"] .dn-filter .control{ min-width:160px; }
    body[data-page="dn-client"] .dn-day{
      border:1px solid rgba(15,35,75,.10); border-radius:14px; background:rgba(255,255,255,.78);
      padding:14px 16px; margin-bottom:12px;
    }
    body[data-page="dn-client"] .dn-day__head{
      display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px;
    }
    body[data-page="dn-client"] .dn-day__title{ margin:0; font-size:17px; }
    body[data-page="dn-client"] .dn-table{ width:100%; border-collapse:collapse; }
    body[data-page="dn-client"] .dn-table th,
    body[data-page="dn-client"] .dn-table td{
      padding:10px 8px; border-bottom:1px solid rgba(15,35,75,.08);
      text-align:left; vertical-align:top; font-size:14px;
    }
    body[data-page="dn-client"] .dn-table th{ background:rgba(63,111,232,.06); font-weight:800; }
    body[data-page="dn-client"] .dn-table tr:last-child td{ border-bottom:none; }
    body[data-page="dn-client"] .dn-status{
      display:inline-flex; align-items:center; height:24px; padding:0 10px;
      border-radius:999px; font-size:12px; font-weight:800; letter-spacing:.3px; text-transform:uppercase;
      border:1px solid rgba(11,27,58,.14);
    }
    body[data-page="dn-client"] .dn-status.is-done{ background:rgba(16,185,129,.10); color:#065f46; border-color:rgba(16,185,129,.28); }
    body[data-page="dn-client"] .dn-status.is-open{ background:rgba(245,158,11,.12); color:#92400e; border-color:rgba(245,158,11,.30); }
    body[data-page="dn-client"] .dn-status.is-fail{ background:rgba(220,38,38,.12); color:#b91c1c; border-color:rgba(220,38,38,.28); }
    body[data-page="dn-client"] .dn-empty{ color:var(--muted); padding-top:8px; }
    body[data-page="dn-client"] .dn-measure{ font-weight:800; }
    body[data-page="dn-client"] .dn-comment{ color:var(--muted); }
    @media (max-width:760px){
      body[data-page="dn-client"] .stats-grid{ grid-template-columns:1fr 1fr; }
      body[data-page="dn-client"] .dn-head{ flex-wrap:wrap; }
      body[data-page="dn-client"] .dn-head > div:first-child{ flex:1 1 100%; }
      body[data-page="dn-client"] .dn-actions{ width:100%; }
      body[data-page="dn-client"] .dn-actions > *{ flex:1 1 auto; text-align:center; }
      body[data-page="dn-client"] .dn-filter .control{ min-width:0; flex:1 1 auto; }
      body[data-page="dn-client"] .dn-table thead{ display:none; }
      body[data-page="dn-client"] .dn-table, body[data-page="dn-client"] .dn-table tbody,
      body[data-page="dn-client"] .dn-table tr, body[data-page="dn-client"] .dn-table td{ display:block; width:100%; }
      body[data-page="dn-client"] .dn-table tr{ border-bottom:1px solid rgba(15,35,75,.08); padding:6px 0; }
      body[data-page="dn-client"] .dn-table td{ border:none; padding:4px 0; }
      body[data-page="dn-client"] .dn-table td::before{ content: attr(data-label) ": "; font-weight:800; color:var(--muted); }
    }
  </style>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#0f2744">
</head>
<body data-page="dn-client">
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="dashboard-client.html" aria-label="Nursy Startseite">
        <img class="brand__dot" src="nursy-logo.png" alt="Nursy" />
        <span class="brand__text">
          <strong>Nursy</strong>
          <span>Fürsorge mit Herz</span>
        </span>
      </a>
      <nav class="nav" aria-label="Hauptnavigation">
        <a href="dashboard-client.html">Dashboard</a>
        <a href="careplan-client.html">Pflegeplan</a>
        <a href="documentation-client.html">Dokumentation</a>
      </nav>
    </div>
  </header>

  <main class="container dn-wrap">
    <section class="card">
      <div class="dn-head">
        <div>
          <h1 style="margin:0 0 6px;">Durchführungsnachweis</h1>
          <p class="muted" style="margin:0;">Abgezeichnete Maßnahmen deiner Pflegekräfte – nur abgeschlossene Einträge sind sichtbar.</p>
        </div>
        <div class="dn-actions">
          <a class="control btn" href="dashboard-client.html">Zurück</a>
          <button class="control btn" type="button" id="dnPrint">Drucken</button>
        </div>
      </div>

      <div class="stats-grid">
        <div class="card stat-card"><span class="muted">Abgezeichnet gesamt</span><strong id="dnStatTotal">0</strong></div>
        <div class="card stat-card"><span class="muted">Heute</span><strong id="dnStatToday">0</strong></div>
        <div class="card stat-card"><span class="muted">Tage mit Einträgen</span><strong id="dnStatDays">0</strong></div>
        <div class="card stat-card"><span class="muted">Letzte Abzeichnung</span><strong id="dnStatLast">—</strong></div>
      </div>

      <div class="dn-filter">
        <select class="control" id="dnRangeFilter" aria-label="Zeitraum">
          <option value="all">Gesamter Zeitraum</option>
          <option value="today">Heute</option>
          <option value="week" selected>Diese Woche</option>
        </select>
        <input class="control" id="dnSearch" type="text" placeholder="Maßnahme oder Pflegekraft suchen" />
      </div>

      <div id="dnDays"></div>
      <p class="dn-empty" id="dnEmpty" hidden>Keine Einträge für diesen Filter gefunden.</p>
    </section>
  </main>

  <script src="df-measures.js"></script>
  <script src="durchfuehrungsnachweis-client.js"></script>
</body>
</html>
