<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nursy – Meine Rechnungen</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body[data-page="invoices-client"] .invoices-wrap{ padding:24px 0 40px; }
    body[data-page="invoices-client"] .invoices-head{
      display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:16px;
    }
    body[data-page="invoices-client"] .invoices-actions{ display:flex; gap:10px; flex-wrap:wrap; }
    body[data-page="invoices-client"] .stats-grid{
      display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:16px;
    }
    body[data-page="invoices-client"] .stat-card strong{ display:block; font-size:28px; margin-top:6px; }
    body[data-page="invoices-client"] .invoice-list{ display:flex; flex-direction:column; gap:12px; }
    body[data-page="invoices-client"] .invoice-row{
      display:grid; grid-template-columns:minmax(220px,1.6fr) 130px 130px 120px minmax(220px,1.2fr);
      gap:14px; align-items:center; padding:14px;
      border:1px solid rgba(15,35,75,.10); border-radius:14px; background:rgba(255,255,255,.75);
    }
    body[data-page="invoices-client"] .invoice-title{ font-weight:900; letter-spacing:.2px; }
    body[data-page="invoices-client"] .invoice-sub{ color:var(--muted); font-size:14px; margin-top:4px; }
    body[data-page="invoices-client"] .invoice-amount{ font-weight:900; }
    body[data-page="invoices-client"] .invoice-date{ color:rgba(15,26,51,.78); font-weight:700; }
    body[data-page="invoices-client"] .invoice-actions{ display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
    body[data-page="invoices-client"] .invoice-status{
      display:inline-flex; align-items:center; justify-content:center; min-width:110px; height:34px;
      padding:0 12px; border-radius:999px; font-weight:900; font-size:12px; letter-spacing:.35px; text-transform:uppercase;
      border:1px solid rgba(11,27,58,.14); background:rgba(11,27,58,.04); color:rgba(11,27,58,.78);
    }
    body[data-page="invoices-client"] .invoice-status.is-paid{ border-color:rgba(16,185,129,.28); background:rgba(16,185,129,.10); color:#065f46; }
    body[data-page="invoices-client"] .invoice-status.is-open{ border-color:rgba(245,158,11,.30); background:rgba(245,158,11,.12); color:#92400e; }
    body[data-page="invoices-client"] .invoice-status.is-overdue{ border-color:rgba(220,38,38,.28); background:rgba(220,38,38,.12); color:#b91c1c; }
    body[data-page="invoices-client"] .invoice-empty{ color:var(--muted); padding-top:10px; }
    body[data-page="invoices-client"] .invoice-filter{ margin-bottom:14px; display:flex; gap:10px; flex-wrap:wrap; }
    body[data-page="invoices-client"] .invoice-filter .control{ min-width:170px; }
    body[data-page="invoices-client"] .invoice-modal[hidden]{ display:none; }
    body[data-page="invoices-client"] .invoice-modal{ position:fixed; inset:0; z-index:1000; }
    body[data-page="invoices-client"] .invoice-modal__backdrop{ position:absolute; inset:0; background:rgba(11,27,58,.45); backdrop-filter:blur(6px); }
    body[data-page="invoices-client"] .invoice-modal__panel{
      position:relative; width:min(760px,calc(100% - 28px)); margin:7vh auto 0; background:#fff;
      border-radius:18px; border:1px solid rgba(11,27,58,.12); box-shadow:0 30px 90px rgba(11,27,58,.25);
      overflow:hidden; display:flex; flex-direction:column; max-height:88vh;
    }
    body[data-page="invoices-client"] .invoice-modal__head,
    body[data-page="invoices-client"] .invoice-modal__foot{
      display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px;
      flex-shrink:0;
    }
    body[data-page="invoices-client"] .invoice-modal__head{ border-bottom:1px solid rgba(11,27,58,.10); }
    body[data-page="invoices-client"] .invoice-modal__foot{ border-top:1px solid rgba(11,27,58,.10); justify-content:flex-end; }
    body[data-page="invoices-client"] .invoice-modal__body{ padding:16px; display:grid; gap:14px; overflow-y:auto; flex:1; -webkit-overflow-scrolling:touch; will-change:transform; }
    body[data-page="invoices-client"] .invoice-modal__panel{ transform:translateZ(0); will-change:transform; }
    @media(max-width:920px){
      body[data-page="invoices-client"] .invoice-modal__backdrop{ backdrop-filter:none; }
    }
    body[data-page="invoices-client"] .invoice-detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    body[data-page="invoices-client"] .invoice-detail-box{ padding:14px; border-radius:14px; border:1px solid rgba(15,35,75,.10); background:rgba(255,255,255,.7); }
    body[data-page="invoices-client"] .invoice-lines{ border:1px solid rgba(15,35,75,.10); border-radius:14px; overflow:hidden; }
    body[data-page="invoices-client"] .invoice-line,
    body[data-page="invoices-client"] .invoice-line--head{ display:grid; grid-template-columns:1.8fr .8fr .8fr; }
    body[data-page="invoices-client"] .invoice-line--head{ background:rgba(63,111,232,.06); font-weight:800; }
    body[data-page="invoices-client"] .invoice-line > div,
    body[data-page="invoices-client"] .invoice-line--head > div{ padding:12px 14px; border-bottom:1px solid rgba(15,35,75,.08); }
    body[data-page="invoices-client"] .invoice-lines .invoice-line:last-child > div{ border-bottom:none; }
    body[data-page="invoices-client"] .il-qty{ display:none; color:var(--muted); font-size:.85em; }
    @media (max-width:920px){
      body[data-page="invoices-client"] .stats-grid{ grid-template-columns:1fr 1fr; }
      body[data-page="invoices-client"] .invoice-row{ grid-template-columns:1fr; }
      body[data-page="invoices-client"] .invoice-actions{ justify-content:flex-start; }
      body[data-page="invoices-client"] .invoice-detail-grid{ grid-template-columns:1fr; }
      body[data-page="invoices-client"] .invoice-line,
      body[data-page="invoices-client"] .invoice-line--head{ grid-template-columns:1fr auto; }
      body[data-page="invoices-client"] .il-menge-col{ display:none; }
      body[data-page="invoices-client"] .il-qty{ display:inline; }
    }
    @media (max-width:640px){
      body[data-page="invoices-client"] .stats-grid{ grid-template-columns:1fr; }
      body[data-page="invoices-client"] .invoices-head{ flex-wrap:wrap; }
      body[data-page="invoices-client"] .invoices-head > div:first-child{ flex:1 1 100%; }
      body[data-page="invoices-client"] .invoices-actions{ width:100%; }
      body[data-page="invoices-client"] .invoices-actions > *{ flex:1 1 auto; text-align:center; }
      body[data-page="invoices-client"] .invoice-filter .control{ min-width:0; flex:1 1 auto; }
    }
  </style>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#0f2744">
</head>
<body data-page="invoices-client">
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="dashboard-client.html" aria-label="Nursy Startseite">
        <img class="brand__dot" src="nursy-logo.png" alt="Nursy" />
        <span class="brand__text">
          <strong>Nursy</strong>
          <span>Fürsorge mit Herz</span>
        </span>
      </a>

      <nav class="nav" aria-label="Hauptnavigation">
        <a href="dashboard-client.html">Dashboard</a>
        <a href="careplan.html">Pflegeplan</a>
        <a href="anfragen.html">Anfragen</a>
      </nav>
    </div>
  </header>

  <main class="container invoices-wrap">
    <section class="card">
      <div class="invoices-head">
        <div>
          <h1 style="margin:0 0 6px;">Meine Rechnungen</h1>
          <p class="muted" style="margin:0;">Übersicht über offene, bezahlte und fällige Rechnungen.</p>
        </div>
        <div class="invoices-actions">
          <a class="control btn" href="dashboard-client.html">Zurück</a>
          <button class="control btn" type="button" id="invoiceExportAll">Alle herunterladen</button>
        </div>
      </div>

      <div class="stats-grid">
        <div class="card stat-card">
          <span class="muted">Gesamt</span>
          <strong id="invoiceTotalCount">0</strong>
        </div>
        <div class="card stat-card">
          <span class="muted">Offener Betrag</span>
          <strong id="invoiceOpenAmount">0,00 €</strong>
        </div>
        <div class="card stat-card">
          <span class="muted">Bezahlt</span>
          <strong id="invoicePaidAmount">0,00 €</strong>
        </div>
      </div>

      <div class="invoice-filter">
        <select class="control" id="invoiceStatusFilter" aria-label="Status filtern">
          <option value="all">Alle Status</option>
          <option value="open">Offen</option>
          <option value="paid">Bezahlt</option>
          <option value="overdue">Überfällig</option>
        </select>
        <input class="control" id="invoiceSearch" type="text" placeholder="Rechnungsnummer suchen" />
      </div>

      <div class="invoice-list" id="invoiceList"></div>
      <p class="invoice-empty" id="invoiceEmpty" hidden>Keine Rechnungen für diesen Filter gefunden.</p>
    </section>
  </main>

  <div class="invoice-modal" id="invoiceModal" hidden>
    <div class="invoice-modal__backdrop" data-close-invoice-modal></div>
    <div class="invoice-modal__panel" role="dialog" aria-modal="true" aria-labelledby="invoiceModalTitle">
      <div class="invoice-modal__head">
        <div>
          <h2 id="invoiceModalTitle" style="margin:0;">Rechnungsdetails</h2>
          <p class="muted" id="invoiceModalSub" style="margin:4px 0 0;"></p>
        </div>
        <button class="iconbtn" type="button" data-close-invoice-modal aria-label="Schließen">×</button>
      </div>
      <div class="invoice-modal__body" id="invoiceModalBody"></div>
      <div class="invoice-modal__foot">
        <button class="control btn" type="button" data-close-invoice-modal>Schließen</button>
        <button class="control btn" type="button" id="invoiceExportSingle">Herunterladen</button>
        <button class="control btn primary" type="button" id="invoicePaySingle">Jetzt bezahlen</button>
      </div>
    </div>
  </div>

  <script src="invoices-client.js"></script>
</body>
</html>
