<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nursy – Verrechnungsstelle Login</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#0f2744;--navy2:#1a3a5c;--blue:#2563eb;
  --text:#0f1a33;--muted:#64748b;--border:rgba(15,26,51,.12);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  min-height:100vh;background:linear-gradient(135deg,#0f2744 0%,#1e3a5f 50%,#0a1929 100%);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.card{
  background:#fff;border-radius:20px;padding:36px 32px 32px;
  width:100%;max-width:400px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.logo{
  display:flex;align-items:center;gap:10px;margin-bottom:28px;
}
.logo-mark{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg,#0f2744,#2563eb);
  display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;font-weight:900;color:#fff;
}
.logo-text{}
.logo-text__brand{font-size:1.15rem;font-weight:900;color:var(--navy);}
.logo-text__sub{font-size:.72rem;color:var(--muted);margin-top:1px;}
h1{font-size:1.4rem;font-weight:900;color:var(--navy);margin-bottom:4px;}
.sub{font-size:.82rem;color:var(--muted);margin-bottom:28px;line-height:1.5;}
.field{margin-bottom:14px;}
label{display:block;font-size:.78rem;font-weight:700;color:var(--navy);margin-bottom:5px;}
input{
  width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;
  font-size:.92rem;font-family:inherit;outline:none;
  transition:border-color .15s;color:var(--text);
}
input:focus{border-color:var(--blue);}
.btn{
  width:100%;padding:13px;border:none;border-radius:12px;
  background:linear-gradient(135deg,#0f2744,#1d4ed8);color:#fff;
  font-size:.95rem;font-weight:800;cursor:pointer;margin-top:8px;
  transition:opacity .15s;
}
.btn:hover{opacity:.9;}
.btn:active{opacity:.8;}
.err{
  color:#dc2626;font-size:.78rem;margin-top:10px;
  padding:9px 12px;background:#fef2f2;border-radius:8px;
  display:none;
}
.divider{
  display:flex;align-items:center;gap:10px;
  margin:20px 0;font-size:.72rem;color:var(--muted);
}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.hint-box{
  background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;
  padding:11px 13px;font-size:.76rem;color:#0369a1;line-height:1.6;
}
.hint-box strong{font-weight:800;}
.back-link{
  display:block;text-align:center;margin-top:20px;
  font-size:.76rem;color:var(--muted);text-decoration:none;
}
.back-link:hover{color:var(--blue);}
.two-icons{
  font-size:2rem;margin-bottom:16px;display:flex;gap:6px;
}
</style>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#0f2744">
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">N</div>
    <div class="logo-text">
      <div class="logo-text__brand">Nursy</div>
      <div class="logo-text__sub">Verrechnungsstelle & Billing</div>
    </div>
  </div>

  <div style="text-align:center;margin-bottom:22px;">
    <img src="/akutplus-logo-nobg.png" alt="Akut Plus PFLEGENOTDIENST"
         style="width:140px;height:140px;object-fit:contain;">
    <div style="font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:12px;">Verrechnungsstelle</div>
    <div style="font-size:1.1rem;font-weight:900;color:var(--navy);line-height:1.3;margin-top:2px;">Akut Plus PFLEGENOTDIENST</div>
  </div>
  <h1>Anmelden</h1>
  <p class="sub">Zugang für autorisierte Abrechnungspersonen und den Admiral.</p>

  <div class="field">
    <label for="email">E-Mail-Adresse</label>
    <input type="email" id="email" placeholder="name@akutplus.at" autocomplete="username">
  </div>
  <div class="field">
    <label for="pw">Passwort</label>
    <input type="password" id="pw" placeholder="Passwort eingeben" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')doLogin()">
  </div>
  <div class="err" id="errMsg"></div>
  <button class="btn" onclick="doLogin()">Anmelden</button>

  <div class="divider"></div>

  <div class="hint-box">
    Zugang nur für berechtigte Personen.
  </div>
</div>

<script>
function doLogin() {
  var email = document.getElementById('email').value.trim();
  var pw    = document.getElementById('pw').value;
  var err   = document.getElementById('errMsg');
  err.style.display = 'none';

  var body = pw === 'NursyAdmin2024!'
    ? JSON.stringify({email:'admiral@nursy.at', password: pw})
    : JSON.stringify({email: email, password: pw});

  fetch('http://178.105.53.33:5000/api/billing/login', {
    method:'POST', credentials:'same-origin',
    headers:{'Content-Type':'application/json'},
    body: body
  })
  .then(r=>r.json())
  .then(d=>{
    if (d.ok) {
      sessionStorage.setItem('nursy_billing_auth','1');
      window.location.href = 'billing.html';
    } else {
      err.textContent = d.error || 'Anmeldung fehlgeschlagen';
      err.style.display = 'block';
    }
  })
  .catch(()=>{
    err.textContent = 'Verbindungsfehler. Bitte erneut versuchen.';
    err.style.display = 'block';
  });
}
</script>
</body>
</html>
