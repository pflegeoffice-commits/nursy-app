<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nursy – Meine Pflegekräfte</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body[data-page="caregivers-client"] .cg-wrap{ padding:24px 0 40px; }
    body[data-page="caregivers-client"] .cg-head{
      display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:16px;
    }
    body[data-page="caregivers-client"] .cg-actions{ display:flex; gap:10px; flex-wrap:wrap; }
    body[data-page="caregivers-client"] .cg-filter{ margin:6px 0 14px; display:flex; gap:10px; flex-wrap:wrap; }
    body[data-page="caregivers-client"] .cg-filter .control{ min-width:170px; }
    body[data-page="caregivers-client"] .cg-list{ display:grid; gap:12px; }
    body[data-page="caregivers-client"] .cg-card{
      display:grid; grid-template-columns:64px 1fr auto; gap:14px; align-items:center;
      padding:14px; border:1px solid rgba(15,35,75,.10); border-radius:14px;
      background:rgba(255,255,255,.78);
    }
    body[data-page="caregivers-client"] .cg-avatar{
      width:64px; height:64px; border-radius:999px;
      display:flex; align-items:center; justify-content:center;
      background:linear-gradient(135deg, rgba(63,111,232,.18), rgba(63,111,232,.06));
      color:#0b1b3a; font-weight:900; font-size:20px;
      border:2px solid rgba(15,35,75,.12);
      flex-shrink:0;
    }
    body[data-page="caregivers-client"] .cg-avatar--f{
      background:linear-gradient(135deg, #f9a8d4, #fce7f3);
      color:#831843; border-color:rgba(236,72,153,.35);
    }
    body[data-page="caregivers-client"] .cg-avatar--m{
      background:linear-gradient(135deg, #93c5fd, #dbeafe);
      color:#1e3a8a; border-color:rgba(59,130,246,.35);
    }
    body[data-page="caregivers-client"] .cg-name{ font-weight:900; font-size:17px; }
    body[data-page="caregivers-client"] .cg-meta{ color:var(--muted); font-size:14px; margin-top:4px; display:flex; flex-wrap:wrap; gap:8px 14px; }
    body[data-page="caregivers-client"] .cg-meta .sep{ color:rgba(15,26,51,.35); }
    body[data-page="caregivers-client"] .cg-tags{ margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
    body[data-page="caregivers-client"] .cg-tag{
      display:inline-flex; align-items:center; height:24px; padding:0 10px;
      border-radius:999px; font-size:12px; font-weight:800; letter-spacing:.2px;
      background:rgba(63,111,232,.08); color:#1d3a8a; border:1px solid rgba(63,111,232,.18);
    }
    body[data-page="caregivers-client"] .cg-status{
      display:inline-flex; align-items:center; height:26px; padding:0 10px;
      border-radius:999px; font-weight:800; font-size:12px; letter-spacing:.3px; text-transform:uppercase;
    }
    body[data-page="caregivers-client"] .cg-status.is-active{ background:rgba(16,185,129,.10); color:#065f46; border:1px solid rgba(16,185,129,.28); }
    body[data-page="caregivers-client"] .cg-status.is-paused{ background:rgba(245,158,11,.12); color:#92400e; border:1px solid rgba(245,158,11,.30); }
    body[data-page="caregivers-client"] .cg-actions-row{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    body[data-page="caregivers-client"] .cg-empty{ color:var(--muted); padding-top:8px; }
    body[data-page="caregivers-client"] .stats-grid{
      display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:16px;
    }
    body[data-page="caregivers-client"] .stat-card strong{ display:block; font-size:28px; margin-top:6px; }

    body[data-page="caregivers-client"] .cg-modal[hidden]{ display:none; }
    body[data-page="caregivers-client"] .cg-modal{ position:fixed; inset:0; z-index:1000; }
    body[data-page="caregivers-client"] .cg-modal__backdrop{ position:absolute; inset:0; background:rgba(11,27,58,.45); backdrop-filter:blur(6px); }
    body[data-page="caregivers-client"] .cg-modal__panel{
      position:relative; width:min(620px,calc(100% - 28px)); margin:8vh auto 0; background:#fff;
      border-radius:18px; border:1px solid rgba(11,27,58,.12); box-shadow:0 30px 90px rgba(11,27,58,.25); overflow:hidden;
    }
    body[data-page="caregivers-client"] .cg-modal__head,
    body[data-page="caregivers-client"] .cg-modal__foot{
      display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px;
    }
    body[data-page="caregivers-client"] .cg-modal__head{ border-bottom:1px solid rgba(11,27,58,.10); }
    body[data-page="caregivers-client"] .cg-modal__foot{ border-top:1px solid rgba(11,27,58,.10); justify-content:flex-end; }
    body[data-page="caregivers-client"] .cg-modal__body{ padding:16px; display:grid; gap:14px; }
    body[data-page="caregivers-client"] .cg-detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    body[data-page="caregivers-client"] .cg-detail-box{ padding:14px; border-radius:14px; border:1px solid rgba(15,35,75,.10); background:rgba(255,255,255,.7); }

    @media (max-width:760px){
      body[data-page="caregivers-client"] .cg-head{ flex-wrap:wrap; }
      body[data-page="caregivers-client"] .cg-head > div:first-child{ flex:1 1 100%; }
      body[data-page="caregivers-client"] .cg-actions{ width:100%; }
      body[data-page="caregivers-client"] .cg-actions > *{ flex:1 1 auto; text-align:center; }
      body[data-page="caregivers-client"] .cg-filter .control{ min-width:0; flex:1 1 auto; }
      body[data-page="caregivers-client"] .cg-card{ grid-template-columns:56px 1fr; }
      body[data-page="caregivers-client"] .cg-actions-row{ grid-column:1 / -1; justify-content:flex-start; }
      body[data-page="caregivers-client"] .stats-grid{ grid-template-columns:1fr 1fr; }
      body[data-page="caregivers-client"] .cg-detail-grid{ grid-template-columns:1fr; }
    }
  </style>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#0f2744">
</head>
<body data-page="caregivers-client">
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="dashboard-client.html" aria-label="Nursy Startseite">
        <img class="brand__dot" src="nursy-logo.png" alt="Nursy" />
        <span class="brand__text">
          <strong>Nursy</strong>
          <span>Fürsorge mit Herz</span>
        </span>
      </a>

      <nav class="nav" aria-label="Hauptnavigation">
        <a href="dashboard-client.html">Dashboard</a>
        <a href="careplan.html">Pflegeplan</a>
        <a href="invoices-client.html">Rechnungen</a>
      </nav>
    </div>
  </header>

  <main class="container cg-wrap">
    <section class="card">
      <div class="cg-head">
        <div>
          <h1 style="margin:0 0 6px;">Meine Pflegekräfte</h1>
          <p class="muted" style="margin:0;">Übersicht der Pflegekräfte, die dich aktuell betreuen.</p>
        </div>
        <div class="cg-actions">
          <a class="control btn" href="dashboard-client.html">Zurück</a>
          <a class="control btn primary" href="anfragen-client.html">Neue Anfrage</a>
        </div>
      </div>

      <div class="stats-grid">
        <div class="card stat-card">
          <span class="muted">Zugeteilt</span>
          <strong id="cgStatTotal">0</strong>
        </div>
        <div class="card stat-card">
          <span class="muted">Aktiv</span>
          <strong id="cgStatActive">0</strong>
        </div>
        <div class="card stat-card">
          <span class="muted">Nächster Termin</span>
          <strong id="cgStatNext">—</strong>
        </div>
      </div>

      <div class="cg-filter">
        <select class="control" id="cgStatusFilter" aria-label="Status filtern">
          <option value="all">Alle</option>
          <option value="active">Aktiv</option>
          <option value="paused">Pausiert</option>
        </select>
        <input class="control" id="cgSearch" type="text" placeholder="Name oder Qualifikation suchen" />
      </div>

      <div class="cg-list" id="cgList"></div>
      <p class="cg-empty" id="cgEmpty" hidden>Keine Pflegekräfte für diesen Filter gefunden.</p>
    </section>
  </main>

  <div class="cg-modal" id="cgModal" hidden>
    <div class="cg-modal__backdrop" data-close-cg-modal></div>
    <div class="cg-modal__panel" role="dialog" aria-modal="true" aria-labelledby="cgModalTitle">
      <div class="cg-modal__head">
        <div>
          <h2 id="cgModalTitle" style="margin:0;">Pflegekraft</h2>
          <p class="muted" id="cgModalSub" style="margin:4px 0 0;"></p>
        </div>
        <button class="iconbtn" type="button" data-close-cg-modal aria-label="Schließen">×</button>
      </div>
      <div class="cg-modal__body" id="cgModalBody"></div>
      <div class="cg-modal__foot">
        <button class="control btn" type="button" data-close-cg-modal>Schließen</button>
        <button class="control btn primary" type="button" id="cgModalContact">Nachricht senden</button>
      </div>
    </div>
  </div>

  <script src="caregivers-client.js"></script>
</body>
</html>
