function doCreatePatient(){
  var g=function(id){ var e=document.getElementById(id); return e?(e.value||'').trim():''; };
  var nach=g('cfNachname'), vor=g('cfVorname');
  if(!nach||!vor){
    var msg=document.getElementById('cfMsg');
    if(msg){ msg.textContent='⚠️ Vor- und Nachname sind Pflichtfelder.'; msg.style.display='block'; }
    return;
  }
  var btn=document.getElementById('cfCreateBtn');
  if(btn) btn.disabled=true;

  var ang=[];
  var a1n=g('cfAngN'), a1v=g('cfAngV');
  if(a1n||a1v) ang.push({nachname:a1n,vorname:a1v,beziehung:g('cfAngBez'),tel:g('cfAngTel')});

  authFetch('/api/register/patient',{
    method:'POST',credentials:'include',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      vorname:vor, nachname:nach,
      birth:g('cfGeburt'), sv:g('cfSV'), tel:g('cfTel'),
      email: g('cfEmail'),
      address:g('cfAddress'), plz:g('cfPlz'), ort:g('cfOrt'),
      haeufigkeit:g('cfFrequenz'),
      angehoerige:ang
    })
  }).then(function(r){ return r.json(); }).then(function(d){
    if(!d.ok){
      var msg=document.getElementById('cfMsg');
      if(msg){ msg.textContent='⚠️ '+(d.error||'Fehler beim Anlegen'); msg.style.display='block'; }
      if(btn) btn.disabled=false;
      return;
    }
    var newPid = d.id;
    /* Link to einsatz if we have an eid */
    var doLink = currentEid
      ? authFetch('/api/einsaetze/'+encodeURIComponent(currentEid)+'/patient',{
          method:'POST',credentials:'include',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({patient_id:newPid})
        })
      : Promise.resolve();
    doLink.then(function(){
      toast('✅ Patientenakte angelegt!');
      history.replaceState(null,'','?pid='+encodeURIComponent(newPid)+(currentEid?'&eid='+encodeURIComponent(currentEid):'')+'&from='+getParams().from);
      loadPatient(newPid);
    });
  }).catch(function(){
    var msg=document.getElementById('cfMsg');
    if(msg){ msg.textContent='⚠️ Verbindungsfehler'; msg.style.display='block'; }
    if(btn) btn.disabled=false;
  });
}

/* ── Load helpers ── */
function loadPatient(pid){
  authFetch('/api/patienten/'+encodeURIComponent(pid),{credentials:'include'})
    .then(function(r){ if(r.status===403){ renderNoAccess(); return null; } return r.json(); })
    .then(function(pr){
      if(!pr) return;
      if(!pr.ok||!pr.patient){ renderNotFound(''); return; }
      authFetch('/api/patienten/'+encodeURIComponent(pid)+'/dokumente',{credentials:'include'})
        .then(function(r2){ return r2.status===403?null:r2.json(); })
        .then(function(dr){
          renderPatientPage(pr.patient, (dr&&dr.ok)?dr.dokumente:[]);
        });
    });
}

function renderNoAccess(){
  setNav();
  document.getElementById('paContent').innerHTML =
    '<button class="pa-back" onclick="history.back()">← Zurück</button>'+
    '<div class="pa-not-found"><div class="pa-not-found__ico">🔒</div>'+
    '<h2>Kein Zugriff</h2>'+
    '<p>Patientenakten können nur eingesehen werden, wenn ein Einsatz mit diesem Patienten auf dieses Fahrzeug aufgespielt wurde.</p>'+
    '</div>';

function renderNotFound(name){
  setNav();
  document.getElementById('paContent').innerHTML =
    '<button class="pa-back" onclick="history.back()">← Zurück</button>'+
    '<div class="pa-not-found"><div class="pa-not-found__ico">🔍</div>'+
    '<h2>Patient nicht gefunden</h2>'+
    '<p>'+(name?'Kein Patient gefunden für: <strong>'+esc(name)+'</strong>':'Kein Patient angegeben.')+'</p>'+
    '</div>'+
    '<div class="pa-search-form">'+
      '<input class="pa-input" id="paSearchInput" type="text" placeholder="Name suchen…" value="'+esc(name||'')+'" />'+
      '<button class="pa-search-btn" onclick="doSearch()">Suchen</button>'+
    '</div>'+
    '<div id="paSearchResults" style="margin-top:12px"></div>';
  var inp=document.getElementById('paSearchInput');
  if(inp) inp.addEventListener('keydown',function(e){ if(e.key==='Enter') doSearch(); });
  if(name) doSearch();
}

function doSearch(){
  var q=(document.getElementById('paSearchInput')||{}).value||'';
  if(!q.trim()) return;
  authFetch('/api/patienten?name='+encodeURIComponent(q.trim()),{credentials:'include'})
    .then(function(r){ return r.json(); })
    .then(function(res){
      var patients=res.patients||[];
      var cont=document.getElementById('paSearchResults');
      if(!cont) return;
      if(!patients.length){
        cont.innerHTML='<p style="text-align:center;color:var(--muted);font-size:.84rem;">Kein Patient gefunden.</p>';
        return;
      }
      cont.innerHTML='<div style="display:grid;gap:8px;">'+patients.map(function(p){
        return '<div style="display:flex;align-items:center;gap:10px;background:#fff;border:var(--border);border-radius:11px;padding:11px 14px;">'+
          '<div style="flex:1;min-width:0;">'+
            '<div style="font-size:.88rem;font-weight:800;color:#1e293b;">'+esc(p.name)+'</div>'+
            '<div style="font-size:.74rem;color:var(--muted);">'+(p.birth?'geb. '+p.birth+' · ':'')+esc(p.address||'–')+'</div>'+
          '</div>'+
          '<button onclick="loadPatient(\''+esc(p.id)+'\')" style="padding:7px 14px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit;">Öffnen</button>'+
        '</div>';
      }).join('')+'</div>';
    });
}

/* ══════════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════════ */
(function init(){
  var params=getParams();
  var pid  = params.pid  || '';
  var eid  = params.eid  || '';
  var name = params.name || '';
  currentEid = eid;

  if(pid){
    authFetch('/api/patienten/'+encodeURIComponent(pid),{credentials:'include'})
      .then(function(r){ if(r.status===403){ renderNoAccess(); return null; } return r.json(); })
      .then(function(pr){
        if(!pr) return;
        if(!pr.ok||!pr.patient){
          /* pid invalid - try create flow if eid present */
          if(eid) loadEinsatzAndCreate(eid);
          else renderNotFound('');
          return;
        }
        authFetch('/api/patienten/'+encodeURIComponent(pid)+'/dokumente',{credentials:'include'})
          .then(function(r2){ return r2.status===403?null:r2.json(); })
          .then(function(dr){
            renderPatientPage(pr.patient, (dr&&dr.ok)?dr.dokumente:[]);
          });
      })
      .catch(function(){ if(eid) loadEinsatzAndCreate(eid); else renderNotFound(''); });

  } else if(eid){
    /* No pid but have eid → create flow */
    loadEinsatzAndCreate(eid);

  } else if(name){
    authFetch('/api/patienten?name='+encodeURIComponent(name),{credentials:'include'})
      .then(function(r){ if(r.status===403){ renderNoAccess(); return null; } return r.json(); })
      .then(function(res){
        if(!res) return;
        var patients=res.patients||[];
        if(patients.length===1) loadPatient(patients[0].id);
        else renderNotFound(name);
      })
      .catch(function(){ renderNotFound(name); });
  } else {
    renderNotFound('');
  }
}());
</script>
</body>
</html>
