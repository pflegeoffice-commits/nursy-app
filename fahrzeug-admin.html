<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Fahrzeugbestätigungen – Admin</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #0f2744;
    --accent:  #2563eb;
    --green:   #16a34a;
    --red:     #dc2626;
    --bg:      #f0f4f8;
    --card:    #ffffff;
    --border:  #dbe2f0;
    --text:    #1e293b;
    --muted:   #6b7280;
    --sidebar: #1e3a5f;
    --radius:  12px;
  }
  body   { font-family: system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
  a { color: inherit; text-decoration: none; }

  /* ── Header ── */
  .header { background:var(--primary); color:#fff; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; position:sticky; top:0; z-index:50; box-shadow:0 2px 10px rgba(0,0,0,.25); }
  .header__brand { font-size:1.05rem; font-weight:800; }
  .header__sub   { font-size:.72rem; opacity:.7; margin-top:2px; }
  .header__logout { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); color:#fff; border-radius:999px; padding:6px 14px; font-size:.78rem; font-weight:700; cursor:pointer; }
  .header__logout:hover { background:rgba(255,255,255,.22); }

  /* ── Layout ── */
  .layout { display:flex; flex:1; min-height:0; }

  /* ── Sidebar ── */
  .sidebar { width:260px; background:var(--sidebar); color:#cbd5e1; flex-shrink:0; overflow-y:auto; }
  @media(max-width:768px){ .sidebar { width:100%; max-height:260px; border-bottom:1px solid rgba(255,255,255,.1); } }
  .sidebar__head { padding:14px 16px 10px; font-size:.7rem; font-weight:800; color:#94a3b8; text-transform:uppercase; letter-spacing:.06em; border-bottom:1px solid rgba(255,255,255,.08); }
  .tree-node { border-bottom:1px solid rgba(255,255,255,.05); }
  .tree-node__label { display:flex; align-items:center; gap:8px; padding:10px 16px; cursor:pointer; font-size:.84rem; font-weight:600; color:#cbd5e1; transition:background .12s; user-select:none; }
  .tree-node__label:hover { background:rgba(255,255,255,.07); }
  .tree-node__label.active { background:rgba(37,99,235,.22); color:#fff; }
  .tree-node__arrow { font-size:.65rem; transition:transform .15s; flex-shrink:0; }
  .tree-node__arrow.open { transform:rotate(90deg); }
  .tree-node__count { margin-left:auto; background:rgba(255,255,255,.12); border-radius:999px; padding:1px 7px; font-size:.68rem; }
  .tree-children { display:none; }
  .tree-children.open { display:block; }
  .tree-leaf { display:block; padding:7px 16px 7px 36px; font-size:.8rem; color:#94a3b8; cursor:pointer; transition:background .12s; }
  .tree-leaf:hover { background:rgba(255,255,255,.06); color:#fff; }
  .tree-leaf.active { background:rgba(37,99,235,.3); color:#fff; }
  .tree-leaf3 { padding-left:52px; font-size:.76rem; }

  /* ── Main ── */
  .main-area { flex:1; overflow-y:auto; padding:20px; min-width:0; }

  /* ── Filter bar ── */
  .filter-bar { background:var(--card); border-radius:var(--radius); box-shadow:0 1px 4px rgba(0,0,0,.07); padding:14px 16px; margin-bottom:16px; }
  .filter-title { font-size:.72rem; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px; }
  .filter-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .filter-input { width:100%; padding:8px 11px; border:1.5px solid var(--border); border-radius:9px; font-size:.83rem; font-family:inherit; color:var(--text); outline:none; transition:border-color .13s; background:#fafbfc; }
  .filter-input:focus { border-color:var(--accent); }
  .filter-actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .btn-filter { padding:8px 16px; border-radius:999px; font-size:.82rem; font-weight:700; cursor:pointer; border:none; transition:opacity .13s; }
  .btn-filter--primary { background:var(--accent); color:#fff; }
  .btn-filter--reset   { background:#f1f5f9; color:var(--muted); border:1.5px solid var(--border); }
  .btn-filter:hover { opacity:.85; }

  /* ── Tabelle ── */
  .tbl-wrap { background:var(--card); border-radius:var(--radius); box-shadow:0 1px 4px rgba(0,0,0,.07); overflow:hidden; margin-bottom:16px; }
  .tbl-head { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--border); }
  .tbl-head__title { font-size:.8rem; font-weight:800; color:var(--primary); text-transform:uppercase; letter-spacing:.04em; }
  .tbl-head__count { font-size:.75rem; color:var(--muted); }
  table { width:100%; border-collapse:collapse; font-size:.82rem; }
  th { background:var(--primary); color:#fff; padding:9px 12px; text-align:left; font-size:.72rem; font-weight:700; letter-spacing:.03em; }
  td { padding:9px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:#f8fafc; }
  .badge { display:inline-block; border-radius:999px; padding:2px 9px; font-size:.7rem; font-weight:700; }
  .badge--green { background:#dcfce7; color:var(--green); }
  .badge--yellow{ background:#fef9c3; color:#92400e; }
  .btn-row { padding:5px 12px; border-radius:999px; font-size:.75rem; font-weight:700; border:1.5px solid var(--border); background:#fff; cursor:pointer; white-space:nowrap; }
  .btn-row:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn-row--pdf { border-color:#ef4444; color:#ef4444; }
  .btn-row--pdf:hover { background:#ef4444; color:#fff; border-color:#ef4444; }
  .empty { text-align:center; padding:32px; color:var(--muted); font-size:.9rem; }

  /* ── Modal ── */
  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding:20px; overflow-y:auto; }
  .modal-backdrop.hidden { display:none; }
  .modal { background:#fff; border-radius:16px; width:100%; max-width:680px; box-shadow:0 8px 40px rgba(0,0,0,.2); overflow:hidden; }
  .modal__head { background:var(--primary); color:#fff; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; }
  .modal__title { font-size:1rem; font-weight:800; }
  .modal__close { background:rgba(255,255,255,.12); border:none; color:#fff; border-radius:999px; width:30px; height:30px; font-size:1.1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .modal__close:hover { background:rgba(255,255,255,.25); }
  .modal__body { padding:20px; overflow-y:auto; max-height:80vh; }
  .modal__section { margin-bottom:18px; }
  .modal__section-title { font-size:.72rem; font-weight:800; color:var(--accent); text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px; padding-bottom:5px; border-bottom:1px solid var(--border); }
  .modal__grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .modal__item__label { font-size:.68rem; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.03em; margin-bottom:2px; }
  .modal__item__val   { font-size:.9rem; font-weight:700; color:var(--text); }
  .cb-check { display:flex; align-items:flex-start; gap:8px; margin-bottom:7px; font-size:.83rem; }
  .cb-check__icon { flex-shrink:0; width:20px; height:20px; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:.75rem; font-weight:800; margin-top:1px; }
  .cb-check__icon--yes { background:#dcfce7; color:var(--green); }
  .cb-check__icon--no  { background:#fee2e2; color:var(--red); }
  .sig-img { max-width:100%; border:1.5px solid var(--border); border-radius:8px; background:#f8fafc; }
  .foto-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .foto-row img { width:90px; height:90px; border-radius:8px; object-fit:cover; border:1.5px solid var(--border); cursor:pointer; }
  .modal__actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; padding-top:14px; border-top:1px solid var(--border); }
  .btn-modal { padding:10px 20px; border-radius:999px; font-size:.85rem; font-weight:700; cursor:pointer; border:none; }
  .btn-modal--pdf { background:#ef4444; color:#fff; }
  .btn-modal--close { background:#f1f5f9; color:var(--text); border:1.5px solid var(--border); }

  /* ── Scroll ── */
  ::-webkit-scrollbar { width:6px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:3px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header__brand">Akut Plus – Fahrzeugbestätigungen</div>
    <div class="header__sub">Adminbereich · Internes Modul</div>
  </div>
  <button class="header__logout" onclick="history.back()">← Zurück</button>
</div>

<div class="layout">

  <!-- Sidebar: Ordnerbaum -->
  <aside class="sidebar">
    <div class="sidebar__head">Ordnerstruktur</div>
    <div id="treeRoot">
      <div style="padding:16px;font-size:.8rem;color:#94a3b8;">Wird geladen …</div>
    </div>
  </aside>

  <!-- Hauptbereich -->
  <main class="main-area">

    <!-- Filter -->
    <div class="filter-bar">
      <div class="filter-title">Suche &amp; Filter</div>
      <div class="filter-grid">
        <input class="filter-input" id="fName"          placeholder="Pflegekraft" />
        <input class="filter-input" id="fDienst"        placeholder="Dienstnummer" />
        <input class="filter-input" id="fFahrzeug"      placeholder="Fahrzeug" />
        <input class="filter-input" id="fKennzeichen"   placeholder="Kennzeichen" />
        <input class="filter-input" id="fBundesland"    placeholder="Bundesland" />
        <input class="filter-input" id="fBezirk"        placeholder="Bezirk" />
        <input class="filter-input" id="fDatum"         type="date" />
      </div>
      <div class="filter-actions">
        <button class="btn-filter btn-filter--primary" onclick="loadForms()">🔍 Suchen</button>
        <button class="btn-filter btn-filter--reset"   onclick="resetFilter()">✕ Zurücksetzen</button>
      </div>
    </div>

    <!-- Tabelle -->
    <div class="tbl-wrap">
      <div class="tbl-head">
        <div class="tbl-head__title">Formulare</div>
        <div class="tbl-head__count" id="tblCount">–</div>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Datum</th>
              <th>Pflegekraft</th>
              <th>Dienstnr.</th>
              <th>Fahrzeug</th>
              <th>Kennzeichen</th>
              <th>Bezirk</th>
              <th>Status</th>
              <th>Aktionen</th>
            </tr>
          </thead>
          <tbody id="tblBody">
            <tr><td colspan="8" class="empty">Formulare werden geladen …</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<!-- Detail-Modal -->
<div class="modal-backdrop hidden" id="modalBackdrop" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal__head">
      <div class="modal__title" id="modalTitle">Formular</div>
      <button class="modal__close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal__body" id="modalBody"></div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var CB_KEYS   = ['cb_uebernommen','cb_sauber','cb_schaeden','cb_material',
                   'cb_med_geprueft','cb_med_verwendbar','cb_haftung',
                   'cb_selbstbehalt','cb_rueckgabe','cb_eigen_haftung'];
  var CB_LABELS = [
    'Fahrzeug ordnungsgemäß übernommen',
    'Fahrzeug sauber übernommen',
    'Keine sichtbaren Schäden oder Schäden dokumentiert',
    'Material vollständig vorhanden',
    'Medizinische Produkte überprüft',
    'Medizinische Produkte können fachgerecht verwendet werden',
    'Haftungsregelung gelesen und akzeptiert',
    'Selbstverschuldeter Schaden: 1/3 des Selbstbehalts',
    'Nach Dienstende: sauber und vollständig hinterlassen',
    'Eigenverantwortung im gesetzlichen Rahmen anerkannt',
  ];

  /* ── Baum laden ── */
  function loadTree() {
    fetch('http://178.105.53.33:5000/api/admin/fahrzeug/struktur', { credentials:'include' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if (!d || !d.ok) { document.getElementById('treeRoot').innerHTML = '<div style="padding:16px;font-size:.8rem;color:#ef4444;">Zugriff verweigert</div>'; return; }
        renderTree(d.struktur || {});
      })
      .catch(function(){ document.getElementById('treeRoot').innerHTML = '<div style="padding:16px;font-size:.8rem;color:#ef4444;">Fehler beim Laden</div>'; });
  }

  function renderTree(struktur) {
    var root = document.getElementById('treeRoot');
    var html = '';
    Object.keys(struktur).sort().forEach(function(bl) {
      var blData = struktur[bl];
      var blCount = Object.values(blData).reduce(function(a,bz){ return a + Object.values(bz).reduce(function(x,n){ return x+n; },0); }, 0);
      var blId = 'bl_' + bl.replace(/\W/g,'_');
      html += '<div class="tree-node">';
      html += '<div class="tree-node__label" onclick="toggleTree(\'' + blId + '\',this)">' +
              '<span class="tree-node__arrow" id="arr_' + blId + '">▶</span>' +
              '<span>📁 ' + esc(bl) + '</span>' +
              '<span class="tree-node__count">' + blCount + '</span></div>';
      html += '<div class="tree-children" id="' + blId + '">';
      Object.keys(blData).sort().forEach(function(bz) {
        var bzData = blData[bz];
        var bzCount = Object.values(bzData).reduce(function(a,n){ return a+n; }, 0);
        var bzId = blId + '_' + bz.replace(/\W/g,'_');
        html += '<div class="tree-node__label" onclick="toggleTree(\'' + bzId + '\',this)" style="padding-left:28px;font-size:.8rem;">' +
                '<span class="tree-node__arrow" id="arr_' + bzId + '">▶</span>' +
                '<span>📂 ' + esc(bz) + '</span>' +
                '<span class="tree-node__count">' + bzCount + '</span></div>';
        html += '<div class="tree-children" id="' + bzId + '">';
        Object.keys(bzData).sort().reverse().forEach(function(dt) {
          html += '<div class="tree-leaf tree-leaf3" onclick="filterByNode(\'' + esc(bl) + '\',\'' + esc(bz) + '\',\'' + esc(dt) + '\')">' +
                  '📅 ' + esc(dt) + ' <span style="color:#64748b;font-size:.72rem;">(' + bzData[dt] + ')</span></div>';
        });
        html += '</div>';
      });
      html += '</div></div>';
    });
    root.innerHTML = html || '<div style="padding:16px;font-size:.8rem;color:#94a3b8;">Keine Formulare vorhanden</div>';
  }

  window.toggleTree = function(id, labelEl) {
    var el = document.getElementById(id);
    var arr = document.getElementById('arr_' + id);
    if (!el) return;
    var open = el.classList.toggle('open');
    if (arr) arr.classList.toggle('open', open);
    if (labelEl) labelEl.classList.toggle('active', open);
  };

  window.filterByNode = function(bl, bz, dt) {
    document.querySelectorAll('.tree-leaf').forEach(function(l){ l.classList.remove('active'); });
    event.target.classList.add('active');
    document.getElementById('fBundesland').value = bl;
    document.getElementById('fBezirk').value = bz;
    document.getElementById('fDatum').value = dt;
    document.getElementById('fName').value = '';
    document.getElementById('fDienst').value = '';
    document.getElementById('fFahrzeug').value = '';
    document.getElementById('fKennzeichen').value = '';
    loadForms();
  };

  /* ── Formulare laden ── */
  window.loadForms = function() {
    var params = new URLSearchParams();
    ['Name','Dienst','Fahrzeug','Kennzeichen','Bundesland','Bezirk','Datum'].forEach(function(k) {
      var v = document.getElementById('f' + k).value.trim();
      if (v) params.append(k.toLowerCase() === 'name' ? 'name' : k.toLowerCase(), v);
    });
    document.getElementById('tblBody').innerHTML = '<tr><td colspan="8" class="empty">⏳ Wird geladen …</td></tr>';
    fetch('http://178.105.53.33:5000/api/admin/fahrzeug/formulare?' + params.toString(), { credentials:'include' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if (!d || !d.ok) { document.getElementById('tblBody').innerHTML = '<tr><td colspan="8" class="empty">Zugriff verweigert</td></tr>'; return; }
        renderTable(d.formulare || []);
      })
      .catch(function(){ document.getElementById('tblBody').innerHTML = '<tr><td colspan="8" class="empty">Fehler beim Laden</td></tr>'; });
  };

  function renderTable(rows) {
    document.getElementById('tblCount').textContent = rows.length + ' Formular(e)';
    if (!rows.length) {
      document.getElementById('tblBody').innerHTML = '<tr><td colspan="8" class="empty">Keine Formulare gefunden</td></tr>';
      return;
    }
    var html = rows.map(function(r) {
      var badge = r.dienst_gestartet
        ? '<span class="badge badge--green">✓ Gestartet</span>'
        : '<span class="badge badge--yellow">Ausstehend</span>';
      return '<tr>' +
        '<td style="white-space:nowrap;">' + esc(r.datum) + '<br><span style="font-size:.7rem;color:var(--muted);">' + esc(r.uhrzeit) + '</span></td>' +
        '<td><strong>' + esc(r.caregiver_name) + '</strong></td>' +
        '<td>' + esc(r.dienstnummer || '–') + '</td>' +
        '<td>' + esc(r.fahrzeug || '–') + '</td>' +
        '<td>' + esc(r.kennzeichen || '–') + '</td>' +
        '<td><span style="font-size:.75rem;">' + esc(r.bezirk || '–') + '</span></td>' +
        '<td>' + badge + '</td>' +
        '<td style="white-space:nowrap;display:flex;gap:5px;flex-wrap:wrap;">' +
          '<button class="btn-row" onclick="openModal(\'' + esc(r.id) + '\')">🔍 Details</button>' +
          '<a href="/api/admin/fahrzeug/pdf/' + esc(r.id) + '" target="_blank"><button class="btn-row btn-row--pdf">📄 PDF</button></a>' +
        '</td>' +
        '</tr>';
    }).join('');
    document.getElementById('tblBody').innerHTML = html;
  }

  window.resetFilter = function() {
    ['fName','fDienst','fFahrzeug','fKennzeichen','fBundesland','fBezirk','fDatum'].forEach(function(id){ document.getElementById(id).value = ''; });
    document.querySelectorAll('.tree-leaf').forEach(function(l){ l.classList.remove('active'); });
    loadForms();
  };

  /* ── Modal ── */
  window.openModal = function(formId) {
    document.getElementById('modalBody').innerHTML = '<div class="empty">⏳ Wird geladen …</div>';
    document.getElementById('modalTitle').textContent = 'Formular ' + formId;
    document.getElementById('modalBackdrop').classList.remove('hidden');
    fetch('http://178.105.53.33:5000/api/admin/fahrzeug/formular/' + encodeURIComponent(formId), { credentials:'include' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if (!d || !d.ok) { document.getElementById('modalBody').innerHTML = '<div class="empty">Fehler beim Laden</div>'; return; }
        renderModal(d.formular);
      })
      .catch(function(){ document.getElementById('modalBody').innerHTML = '<div class="empty">Fehler</div>'; });
  };

  function renderModal(f) {
    var fotos = f.foto_pfade || [];
    var html = '';

    /* Dienstdaten */
    html += '<div class="modal__section"><div class="modal__section-title">Dienstdaten</div><div class="modal__grid">';
    [['Pflegekraft',f.caregiver_name],['Dienstnummer',f.dienstnummer],
     ['Fahrzeug',f.fahrzeug],['Kennzeichen',f.kennzeichen],
     ['Bundesland',f.bundesland],['Bezirk',f.bezirk],
     ['Datum',f.datum],['Uhrzeit',f.uhrzeit],
     ['Gespeichert',f.gespeichert_am],['Status',f.dienst_gestartet?'✅ Gestartet':'⏳ Ausstehend']
    ].forEach(function(pair) {
      html += '<div><div class="modal__item__label">' + esc(pair[0]) + '</div><div class="modal__item__val">' + esc(pair[1]||'–') + '</div></div>';
    });
    html += '</div></div>';

    /* Bestätigungen */
    html += '<div class="modal__section"><div class="modal__section-title">Bestätigungen</div>';
    CB_KEYS.forEach(function(k, i) {
      var ok = !!f[k];
      html += '<div class="cb-check">' +
        '<span class="cb-check__icon cb-check__icon--' + (ok?'yes':'no') + '">' + (ok?'✓':'✗') + '</span>' +
        '<span>' + esc(CB_LABELS[i]) + '</span></div>';
    });
    html += '</div>';

    /* Bemerkungen */
    if (f.bemerkungen) {
      html += '<div class="modal__section"><div class="modal__section-title">Bemerkungen</div><p style="font-size:.87rem;line-height:1.55;">' + esc(f.bemerkungen) + '</p></div>';
    }

    /* Unterschrift */
    if (f.unterschrift_data && f.unterschrift_data.startsWith('data:image')) {
      html += '<div class="modal__section"><div class="modal__section-title">Digitale Unterschrift</div>';
      html += '<img class="sig-img" src="' + f.unterschrift_data + '" alt="Unterschrift" /></div>';
    }

    /* Fotos */
    if (fotos.length) {
      html += '<div class="modal__section"><div class="modal__section-title">Schadensfotos (' + fotos.length + ')</div><div class="foto-row">';
      fotos.forEach(function(p) {
        if (p && p.startsWith('data:')) {
          html += '<img src="' + p + '" alt="Foto" onclick="window.open(this.src)" />';
        }
      });
      html += '</div></div>';
    }

    /* Aktionen */
    html += '<div class="modal__actions">' +
      '<a href="/api/admin/fahrzeug/pdf/' + esc(f.id) + '" target="_blank">' +
        '<button class="btn-modal btn-modal--pdf">📄 PDF herunterladen</button></a>' +
      '<button class="btn-modal btn-modal--close" onclick="closeModal()">Schließen</button>' +
      '</div>';

    html += '<div style="font-size:.72rem;color:var(--muted);margin-top:10px;">Formular-ID: ' + esc(f.id) + '</div>';

    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('modalTitle').textContent = f.caregiver_name + ' – ' + f.datum;
  }

  window.closeModal = function(e) {
    if (e && e.target !== document.getElementById('modalBackdrop')) return;
    document.getElementById('modalBackdrop').classList.add('hidden');
  };

  /* ── Helpers ── */
  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── Init ── */
  loadTree();
  loadForms();
}());
</script>
</body>
