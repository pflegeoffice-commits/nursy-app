<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Nursy – Kfz-Checkliste</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#0f2744;--navy2:#1a3a5c;--blue:#2563eb;
  --bg:#f0f4fb;--card:#fff;
  --text:#0f1a33;--muted:#64748b;--border:rgba(15,26,51,.12);--r:14px;
}
html,body{height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;
}
.fb-hdr{
  background:var(--navy);color:#fff;
  padding:12px 14px 10px;flex-shrink:0;
}
.fb-hdr__top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.fb-hdr__back{
  background:rgba(255,255,255,.12);border:none;border-radius:8px;
  color:rgba(255,255,255,.85);font-size:.75rem;font-weight:700;
  padding:5px 10px;cursor:pointer;white-space:nowrap;text-decoration:none;
}
.fb-hdr__title{font-size:1.05rem;font-weight:900;letter-spacing:-.01em;}
.content{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:32px 24px;text-align:center;
}
.soon-icon{font-size:3.5rem;margin-bottom:16px;}
.soon-title{font-size:1.3rem;font-weight:900;color:var(--navy);margin-bottom:8px;}
.soon-sub{font-size:.88rem;color:var(--muted);line-height:1.6;max-width:280px;}
.soon-badge{
  margin-top:20px;display:inline-block;
  background:#fef3c7;border:1.5px solid #fcd34d;
  color:#92400e;border-radius:999px;
  padding:6px 18px;font-size:.78rem;font-weight:800;
}
</style>
</head>
<body>

<header class="fb-hdr">
  <div class="fb-hdr__top">
    <a class="fb-hdr__back" href="/auftragslage.html">← Auftragslage</a>
    <div style="flex:1;text-align:center;">
      <div class="fb-hdr__title">✅ Kfz-Checkliste</div>
    </div>
    <div style="width:80px;"></div>
  </div>
</header>

<div class="content">
  <div class="soon-icon">🔧</div>
  <div class="soon-title">In Vorbereitung</div>
  <div class="soon-sub">
    Die digitale Fahrzeug-Checkliste wird gerade entwickelt und steht bald zur Verfügung.
  </div>
  <div class="soon-badge">🚧 Kommt bald</div>
</div>

</body>
</html>
