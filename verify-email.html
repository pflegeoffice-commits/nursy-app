<!doctype html>
<html lang="de">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nursy – E-Mail Bestätigung</title><link rel="stylesheet" href="styles.css" />    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#0f2744">
</head>
<body>
<header class="topbar">
  <div class="container topbar__inner">
    <a class="brand" href="index.html" aria-label="Nursy Startseite">
      <img class="brand__dot" src="nursy-logo.png" alt="Nursy" />
      <span class="brand__text">
        <strong>Nursy</strong>
        <span>Fürsorge mit Herz</span>
      </span>
    </a>

    <nav class="nav" aria-label="Hauptnavigation">
      <a href="functions.html">Funktionen</a>
      <a href="how.html">So funktioniert's</a>
      <a href="index.html#login">Login</a>
    </nav>
  </div>
</header>

<main class="container">
<section class="section">
  <div class="section__head">
    <h2 id="pageTitle">E-Mail bestätigen</h2>
  </div>

  <div id="stepBar"></div>

  <div class="card">
    <h3>Fast geschafft</h3>
    <p class="muted">Wir haben dir eine E-Mail mit einem Bestätigungslink geschickt. Bitte bestätige deine Registrierung.</p>

    <div style="height:14px"></div>
    <a class="control btn" href="#" data-action="resend">E-Mail erneut senden</a>

    <div style="height:12px"></div>
    <a class="control btn primary" id="verifyContinue" href="#">Weiter →</a>
  </div>
</section>
</main>

<footer class="footer">
  <div class="container footer__inner">
    <span class="muted">© Nursy – Fürsorge mit Herz</span>
    <div class="footer__links">
      <a href="#">Impressum</a>
      <a href="#">Datenschutz</a>
    </div>
  </div>
</footer>

<script src="script.js"></script>
<script>
(function () {
  var role = '';
  try { role = localStorage.getItem('nursy_register_role') || ''; } catch(e){}

  var isCare = role === 'care';

  /* ── Weiter-Link setzen ── */
  var btn = document.getElementById('verifyContinue');
  if (btn) {
    btn.href = isCare ? 'register-care-profile.html' : 'register-client-need.html';
  }

  /* ── Fortschrittsbalken rendern ── */
  var bar = document.getElementById('stepBar');
  if (bar) {
    if (isCare) {
      bar.innerHTML =
        '<div class="reg-steps">' +
          '<div class="reg-step reg-step--done"><div class="reg-step__num">✓</div><div class="reg-step__label">Stammdaten</div></div>' +
          '<div class="reg-step__line reg-step__line--done"></div>' +
          '<div class="reg-step reg-step--active"><div class="reg-step__num">2</div><div class="reg-step__label">E-Mail</div></div>' +
          '<div class="reg-step__line"></div>' +
          '<div class="reg-step"><div class="reg-step__num">3</div><div class="reg-step__label">Profil</div></div>' +
          '<div class="reg-step__line"></div>' +
          '<div class="reg-step"><div class="reg-step__num">4</div><div class="reg-step__label">Verfügbarkeit</div></div>' +
        '</div>';
    } else {
      bar.innerHTML =
        '<div class="reg-steps">' +
          '<div class="reg-step reg-step--done"><div class="reg-step__num">✓</div><div class="reg-step__label">Stammdaten</div></div>' +
          '<div class="reg-step__line reg-step__line--done"></div>' +
          '<div class="reg-step reg-step--active"><div class="reg-step__num">2</div><div class="reg-step__label">E-Mail</div></div>' +
          '<div class="reg-step__line"></div>' +
          '<div class="reg-step"><div class="reg-step__num">3</div><div class="reg-step__label">Pflegebedarf</div></div>' +
        '</div>';
    }
  }
}());
</script>
</body>
</html>
